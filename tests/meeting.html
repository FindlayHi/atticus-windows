<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Meeting Copilot checks</title><style>body{background:#141416;color:#f5f5f7;font:14px system-ui;margin:32px}iframe{width:340px;height:650px;border:0;border-radius:18px;background:#262629}pre{white-space:pre-wrap;line-height:1.6}.pass{color:#30d158}.fail{color:#ff453a}</style></head><body><h1>Meeting Copilot checks</h1><p>Mock bridge. No capture, AI, files or PC actions.</p><pre id="results">Running…</pre><iframe id="preview" title="Meeting preview"></iframe>
<script type="module">
const frame=document.getElementById('preview'),results=document.getElementById('results'),checks=[],messages=[];
const assert=(value,name)=>{if(!value)throw Error(name);checks.push('✓ '+name)};
try{
const html=await(await fetch('../ui/meeting.html')).text(),orbs=await(await fetch('../ui/orbs.js')).text();
const ready=new Promise(resolve=>window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;messages.push(e.data);if(e.data.do==='ready')resolve();if(e.data.do==='size'&&Number.isInteger(e.data.reveal))setTimeout(()=>frame.contentWindow.meeting.settled(e.data.reveal),25)}));
const bridge=`<script>window.skipTimers=[];const later=window.setTimeout;window.setTimeout=(f,ms,...args)=>ms===4000?(window.skipTimers.push(f),0):later(f,ms,...args);window.webkit={messageHandlers:{meeting:{postMessage:m=>parent.postMessage(m,'*')}}};<\/script>`;
frame.srcdoc=html.replace('/*ORBS*/',()=>orbs).replace('<head>','<head>'+bridge);
await Promise.race([ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('Meeting did not initialize')),5000))]);
const w=frame.contentWindow,d=w.document,m=w.meeting,$=id=>d.getElementById(id),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
await new Promise(r=>{let n=0;const f=()=>++n>=3?r():w.requestAnimationFrame(f);w.requestAnimationFrame(f);setTimeout(r,3000)});   // a fresh page draws its first frames late on a slow PC or VM: timed checks start once frames run
assert($('start').disabled,'Prep waits for native readiness');
m.prep({});d.getElementById('head').dispatchEvent(new w.PointerEvent('pointerdown',{button:0,bubbles:true}));await wait(20);assert(messages.some(x=>x.do==='drag'),'Header starts native dragging');const dragCount=messages.filter(x=>x.do==='drag').length;$('close').dispatchEvent(new w.PointerEvent('pointerdown',{button:0,bubbles:true}));await wait(20);assert(messages.filter(x=>x.do==='drag').length===dragCount,'Buttons remain clickable instead of dragging');$('head').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait(20);assert(messages.some(x=>x.do==='resetFrame'),'Double-clicking header restores the default spot');   // exactly what native js("prep") sends
m.prep({});assert(d.body.classList.contains('transitioning'),'Panel content waits for native expansion');m.settled(-1);assert(d.body.classList.contains('transitioning'),'Stale resize completion cannot reveal a newer view');for(let ms=0;ms<2000&&d.body.classList.contains('transitioning');ms+=50)await wait(50);assert(!d.body.classList.contains('transitioning'),'Content reveals when the frame settles');
assert(!$('start').disabled,'Native readiness enables Start');
assert(!$('prep').hidden&&$('live').hidden,'Prep is optional and visible first');
$('start').click();await wait(30);assert(messages.some(x=>x.do==='start'&&x.context===''),'Empty context starts a normal call');
m.prep();m.demoPrep({brief:'Demo budget $18,000.'});$('start').click();await wait(30);assert(messages.some(x=>x.do==='start'&&x.context==='Demo budget $18,000.'),'Demo carries its built-in context');
assert($('live').hidden,'Loading demo prep never starts voices or listening');
m.prep();$('context').value='Agenda';m.material('Notes from a file');$('start').click();await wait(30);
assert(messages.some(x=>x.do==='start'&&x.context==='Agenda\n\nNotes from a file'),'One Start carries typed context and files');
m.nudge({title:'Pilot review',when:'Starts in 2 min',who:'Dana',context:'Pilot review\nWith: Dana'});
assert(!$('nudge').hidden&&$('head').hidden&&$('ntitle').textContent==='Pilot review','Calendar nudge shows a small card');
$('ready').click();await wait(30);assert(!$('prep').hidden&&$('context').value.startsWith('Pilot review')&&messages.some(x=>x.do==='focus'),'Get ready opens prep with the invite');
m.nudge({title:'Meeting detected',when:'In Zoom · Want Atticus to listen?',who:'',context:'',go:'Start'});assert($('ready').textContent==='Get ready','Detected call offers context setup');
const sent=messages.length;$('ready').click();await wait(30);assert(!$('prep').hidden&&!messages.slice(sent).some(x=>x.do==='start'),'Detected call opens context before listening');
m.listen();m.saving(true);assert(!$('saving').hidden&&$('saving').textContent==='Saving transcript','Live saving is calmly visible');m.clock(125);assert($('status').textContent==='Getting ready','Startup never claims capture is ready');m.capturing();assert($('status').textContent==='Listening · 02:05','Quiet elapsed listening label');
assert($('prep').hidden&&!$('askbar').hidden,'Listening reveals transcript and ask bar');
const tabTo=name=>d.querySelector(`[data-tab="${name}"]`).click();
tabTo('notes');assert(!$('ctx').hidden&&$('scroll').hidden&&d.activeElement===$('brief'),'Notes tab opens the context editor');$('brief').value='November 13.';$('brief').dispatchEvent(new w.Event('input'));await wait(450);assert(messages.some(x=>x.do==='brief'&&x.text==='November 13.'),'Context can be edited during the call');
m.prepared({brief:'Boiled down.'});m.attachment({name:'Agenda.pdf',folder:'/scratch/notes',img:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'});const attachment=$('livefiles').querySelector('button');attachment.click();assert(attachment.classList.contains('expanded')&&attachment.querySelector('span').textContent==='/scratch/notes','File shows its folder and expands a preview');
m.line({id:1,text:'When does it launch?',seconds:3});m.question({id:1,text:'When does it launch?',seconds:3});
assert(d.querySelectorAll('#lines .line').length===1,'Final transcript line is visible');
tabTo('transcript');assert(!$('transcript').hidden&&d.querySelector('[data-tab="transcript"]').getAttribute('aria-selected')==='true','Transcript is a full tab with accessibility state');
assert(d.querySelector('#lines .line.asked'),'Detected question is marked in the transcript');
d.querySelector('#lines .lineask').click();await wait(30);assert(messages.some(x=>x.do==='ask'&&x.text==='When does it launch?')&&!$('scroll').hidden,'Any transcript line can be answered, for missed questions');tabTo('transcript');
m.line({id:30,text:'I am doing well.',seconds:4,mic:true});assert(!d.querySelector('[data-id="30"] .lineask')&&d.querySelector('[data-id="30"]').classList.contains('mine'),'Own words are marked and not offered for answers');
const range=d.createRange();range.selectNodeContents(d.querySelector('#lines .line .text'));w.getSelection().removeAllRanges();w.getSelection().addRange(range);d.dispatchEvent(new w.Event('selectionchange'));assert(!$('selected').hidden,'Selecting transcript offers Ask about this');
$('selected').click();$('ask').value='Explain the date';$('askform').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));await wait(30);
assert(messages.some(x=>x.do==='ask'&&x.text.includes('When does it launch?')&&x.text.includes('Explain the date')),'Selected lines become question context');
m.thinking(1);assert(d.querySelector('.answer').disabled,'One answer cannot be double-submitted');
m.answer({id:1,kind:'UNSURE',reason:'The launch date has not been shared.'});assert(d.querySelector('.reason').textContent==='The launch date has not been shared.','Missing facts explain why and offer context');
assert(d.querySelector('.answer').textContent==='Add notes','Missing facts offer notes');d.querySelector('.answer').click();assert(!$('ctx').hidden&&!$('retry').hidden&&d.activeElement===$('brief'),'Add notes opens a focused editor with one next action');$('brief').value='The launch is November 13.';$('brief').dispatchEvent(new w.Event('input'));$('retry').click();await wait(30);assert(messages.some(x=>x.do==='answer'&&x.id===1)&&$('ctx').hidden&&!$('scroll').hidden,'Updated notes retry the original question');
m.answer({id:1,kind:'answer',lines:['November 13.','The brief confirms it.'],usd:.001});assert(d.querySelector('.response strong').textContent==='November 13.','Answer lands as one bold spoken line');
assert(!d.querySelector('[data-id="1"] .reason'),'A successful answer clears the missing-context message');
d.querySelector('.response').click();await wait(40);assert(messages.some(x=>x.do==='copy'&&x.text==='November 13.\nThe brief confirms it.'),'Answer button copies the complete answer');
for(let id=2;id<=6;id++)m.question({id,text:'Question '+id,seconds:id});
assert($('questions').children.length===4&&$('older').children.length===2,'Only four question cards stay expanded');
tabTo('notes');assert($('livechoose').getBoundingClientRect().height>0,'Files live in the Notes tab');tabTo('answers');assert($('ctx').hidden,'Answers tab keeps file controls out of the way');
m.question({id:20,text:'How was the drive?',seconds:20,auto:true,heard:true});assert(d.querySelector('[data-id="20"]').hidden,'Heard questions stay hidden while the AI decides');m.thinking(20);m.answer({id:20,kind:'SKIP'});assert(!d.querySelector('[data-id="20"]')&&!w.skipTimers.length,'Skipped heard questions never flash');
m.question({id:21,text:'What is the budget?',seconds:21,auto:true,heard:true});tabTo('transcript');m.answer({id:21,kind:'answer',lines:['$18,000.']});assert(!d.querySelector('[data-id="21"]').hidden&&d.querySelector('[data-tab="answers"]').classList.contains('new'),'Answers appear with a dot when another tab is open');tabTo('answers');assert(!d.querySelector('[data-tab="answers"]').classList.contains('new'),'Opening Answers clears the dot');
m.question({id:8,text:'Automatic question',seconds:8,auto:true});assert(d.querySelector('[data-id="8"] .answer').disabled&&d.querySelector('[data-id="8"] .answer').textContent==='Waiting…','Automatic questions queue without flashing an Answer action');m.thinking(8);assert(d.querySelector('[data-id="8"] .answer').textContent==='Thinking…','Queued questions show their working state');
$('older').querySelector('.collapsed').click();assert(!!$('older').querySelector('.expanded'),'Earlier question expands by keyboard-capable button');
m.answer({id:6,kind:'SKIP'});w.skipTimers.shift()();await wait(350);assert(!d.querySelector('[data-id="6"]'),'False question fades away');
m.answer({id:1,kind:'SKIP'});w.skipTimers.shift()();await wait(350);assert(!!d.querySelector('[data-id="1"]'),'Touched false question stays');
assert(!$('send').classList.contains('blue')&&$('send').getAttribute('aria-label')==='Ask by voice','Empty ask box offers the mic');
$('send').click();await wait(30);assert(messages.some(x=>x.do==='voice'&&x.on)&&$('askform').hidden&&!$('voicebar').hidden&&$('heard').textContent==='Listening…','Mic turns the box into waves and a Listening bubble');
m.heard('What was the budget');m.level(.4);assert($('heard').textContent==='What was the budget'&&[...$('askwave').children].some(b=>parseFloat(b.style.height)>3),'Voice ask shows your words and waves');
$('voicesend').click();await wait(30);assert(messages.some(x=>x.do==='voice'&&!x.on)&&messages.some(x=>x.do==='ask'&&x.text==='What was the budget')&&!$('askform').hidden,'Send asks what you said');
$('send').click();m.heard('Explain pricing');$('voicein').click();assert($('ask').value==='Explain pricing'&&$('send').classList.contains('blue')&&d.activeElement===$('ask'),'Clicking the waves goes back to typing with your words');
$('ask').value='';$('ask').dispatchEvent(new w.Event('input'));assert(!$('send').classList.contains('blue'),'Clearing the box brings the mic back');
$('send').click();d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(30);assert($('voicebar').hidden&&!$('askform').hidden&&!messages.some(x=>x.do==='stop'),'Esc cancels voice without ending the call');
m.voiceEnd();$('send').click();m.voiceEnd();assert($('voicebar').hidden&&!$('askform').hidden,'Native refusal restores the typing box');
m.focus();assert(d.activeElement===$('ask'),'Shortcut focuses typed ask bar');
$('ask').value='Keep my draft';m.question({id:7,text:'Long question '+ 'x'.repeat(400),seconds:50});assert($('ask').value==='Keep my draft','Incoming question preserves draft');
m.error('Try again');assert(!$('toast').hidden,'Worker failure gives short status');
m.stopped();$('endcopy').click();await wait(20);assert(messages.some(x=>x.do==='copy'&&x.text.includes('Them: When does it launch?')),'Ended call can copy a speaker-labeled transcript before closing');m.recap({summary:'Pilot agreed.',action_items:['Send notes']});assert($('endnote').textContent==='Saved on this PC.'&&$('recap').textContent.includes('Send notes'),'Ended view keeps saved meeting and recap');$('allmeetings').click();await wait(20);assert(messages.some(x=>x.do==='meetings'),'Ended view opens all meetings');assert(!$('ended').hidden&&$('askbar').hidden&&$('resume').hidden&&d.activeElement===$('save'),'Ended call asks to save, no Resume');
d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(30);assert(messages.some(x=>x.do==='delete'),'Escape deletes');
$('save').click();await wait(30);assert(messages.some(x=>x.do==='save'),'Save transcript bridge works');
m.answer({id:7,kind:'answer',lines:['Late answer']});assert(!d.querySelector('[data-id="7"] .response'),'Stop ignores late answer');
m.error('Could not save');assert(!$('resume').disabled,'Save failure restores Resume');
const count=d.querySelectorAll('#lines .line').length;$('resume').click();await wait(30);assert(messages.some(x=>x.do==='resume'),'Ended call can resume');
m.listen();m.capturing();assert(d.querySelectorAll('#lines .line').length===count,'Resume retains transcript');
$('resize').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(30);assert(messages.some(x=>x.do==='resize'&&x.w===360),'Resize has keyboard controls');
$('minimize').click();await wait(30);assert(messages.some(x=>x.do==='compact'&&x.on),'Minimize bridge works');m.compact(true);$('restore').dispatchEvent(new w.PointerEvent('pointerdown',{button:0,bubbles:true}));await wait(30);assert(messages.filter(x=>x.do==='drag').length>dragCount,'Minimized pill can drag while preserving click-to-restore');assert(!$('pillow').hidden&&$('live').hidden&&messages.some(x=>x.do==='size'&&x.h===44),'Minimize becomes a small listening pillow');assert($('notice').hidden&&$('toast').hidden,'Listening pillow clears expanded notices');
m.level(.4);assert([...$('wave').children].some(b=>parseFloat(b.style.height)>3),'Captured audio drives the waveform');
m.line({id:9,text:'Words while minimized.',seconds:60});assert(d.querySelectorAll('#lines .line').length===count+1,'Minimized view keeps transcribing');
$('restore').click();await wait(30);assert(messages.some(x=>x.do==='compact'&&!x.on),'Restore bridge works');m.compact(false);assert(!$('live').hidden&&$('pillow').hidden&&$('ask').value==='Keep my draft','Restore keeps the call and draft');
$('livechoose').click();m.material('New facts');await wait(30);assert(messages.some(x=>x.do==='chooseFiles')&&messages.some(x=>x.do==='prepare'&&x.context.includes('New facts')),'Live files update context through the bridge');m.material('Second file');await wait(30);assert(messages.some(x=>x.do==='prepare'&&x.context.includes('New facts')&&x.context.includes('Second file')),'Repeated file additions retain earlier material');
m.partial({mic:true,text:'My words'});assert(!$('micpartial').hidden&&$('micpartial').textContent==='You · My words','Own speech appears while talking');
$('pause').click();await wait(30);assert(messages.some(x=>x.do==='pause'),'Pause bridge works');m.stopped(true);assert($('h1').textContent==='Call paused'&&$('micpartial').hidden,'Pause clears volatile speech and offers Resume');
await wait(100);const rect=$('resume').getBoundingClientRect();m.hover([rect.x+5,rect.y+5]);assert($('resume').classList.contains('hover'),'Inactive-panel pointer tracking lights buttons');m.hover([]);assert(!$('resume').classList.contains('hover'),'Pointer exit clears hover');
m.motion(true);assert(d.body.classList.contains('reduce'),'Native Reduce Motion applies');
assert(d.body.scrollWidth<=340,'Long question fits 340-point panel');
frame.style.width='300px';frame.style.height='160px';await wait(30);assert(d.body.scrollWidth<=300,'Narrow panel has no horizontal overflow');
d.body.scrollTop=d.body.scrollHeight;await wait(30);const buttons=$('delete').getBoundingClientRect();assert(buttons.top>=0&&buttons.bottom<=160,'Ended actions stay reachable on small displays');
results.textContent=checks.join('\n')+`\n\n${checks.length} checks passed.`;results.className='pass';
}catch(error){results.textContent=checks.join('\n')+'\n✗ '+error.message;results.className='fail'}
</script></body></html>
